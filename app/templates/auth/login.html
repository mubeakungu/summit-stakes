{% extends "base.html" %}
{% block title %}Log in - Summit Stakes{% endblock %}
{% block content %}
<div class="auth-wrap">
  <h1>Log in</h1>
  <form method="POST">
    <div class="field">
      <label>Phone number</label>
      <input type="text" name="phone" placeholder="0712345678" required>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" name="password" required>
    </div>
    <button type="submit" class="btn btn-gold" style="width:100%;">Log in</button>
  </form>
  <p style="font-size:13px; color:var(--text-dim); margin-top:14px;">
    New here? <a href="{{ url_for('auth.register') }}" style="color:var(--gold);">Create an account</a>
  </p>
</div>
{% endblock %}
